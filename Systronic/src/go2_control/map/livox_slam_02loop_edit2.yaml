# The second hand-edited version of livox_slam_02loop, saved 2026-09-04.
# Same run, same slam_toolbox output, same origin and resolution - the only
# difference is that the .pgm has been retouched to close gaps the sensor left
# at doorways and glass, and to remove people who walked through the scan.
#
# Same dimensions and origin as the other two, so the three are directly
# comparable: replaying one bag against each isolates the effect of the
# retouching from everything else.
image: livox_slam_02loop_edit2.pgm
mode: trinary
resolution: 0.05
origin: [-13.7, -9.15, 0]
negate: 0
occupied_thresh: 0.65
# 0.19, not the 0.25 map_saver_cli writes. An unknown pixel is 205,
# which is an occupancy of (255-205)/255 = 0.196, and map_server calls a
# cell free when occupancy < free_thresh. At 0.25 every unobserved cell
# loads as FREE rather than unknown - and this map is about 65% unobserved,
# so Nav2 would treat two thirds of it as known drivable floor and plan
# straight through space nothing ever looked at.
free_thresh: 0.19